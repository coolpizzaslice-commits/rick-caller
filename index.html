      const el = $("rfaceTpl").content.firstElementChild.cloneNode(true);
      host.appendChild(el);
      const q = (sel) => el.querySelector(sel);
      const now = performance.now();
      const face = {
        el, mode, mood: "idle", tempTimer: null,
        pointer: { x: 0, y: 0, until: 0 },
        action: null,                                              // the animation playing for an event
        idle: { name: "idle_breathe", start: now, until: now + clipMs("idle_breathe") },
        parts: {
          root: q(".rf-root"), head: q(".rf-head"), hair: q(".rf-hair"), face: q(".rf-face"), nose: q(".rf-nose"),
          irisL: q(".rf-irisL"), irisR: q(".rf-irisR"), lids: q(".rf-lids"),
          browL: q(".rf-browL"), browR: q(".rf-browR"), mouth: q(".rf-mouth"),
        },
        s: { hx: 0, hy: 0, ex: 0, ey: 0, hairX: 0, hairVX: 0, hairY: 0, hairVY: 0 },
        out: Object.assign({}, CHANNEL_REST),
        m: Object.assign({}, MOOD_REST),
      };
      faces.push(face);
      return face;
    }

    const faceVisible = (f) => !!f.el.closest(".screen.active");

    // Look somewhere for a moment (x, y from -1 to 1; y up, like the Blender controller)
    function look(f, x, y, ms = 1500) { f.pointer = { x, y, until: performance.now() + ms }; }

    // Play one of the 20 animations. Looping ones (like "thinking") keep going until another one plays.
    function play(f, name) {
      if (!RIG_CLIPS.clips[name]) return;
      if (faceVisible(f)) voice(name);
      const now = performance.now();
      f.action = { name, start: now, until: RIG_CLIPS.clips[name].loop ? Infinity : now + clipMs(name) };
    }

    // What Rick does when nothing is happening
    function nextIdle(f) {
      if (f.mode !== "full") return "idle_breathe";
      if (restingMood() === "sleepy") return Math.random() < 0.7 ? "sleepy_nod" : "idle_breathe";
      const r = Math.random();
      return r < 0.5 ? "idle_breathe" : r < 0.68 ? "idle_look" : r < 0.85 ? "idle_curious" : "idle_whistle";
    }

    function setMood(f, mood) {
      clearTimeout(f.tempTimer);
      f.tempTimer = null;
      f.mood = mood;
      f.el.dataset.mood = mood;
    }

    // Show a mood for a while, then go back to normal
    function tempMood(f, mood, ms, after) {
      setMood(f, mood);
      f.tempTimer = setTimeout(() => { f.tempTimer = null; setMood(f, after ? after() : "idle"); }, ms);
    }

    const restingMood = () => {
      const h = new Date().getHours();
      return h >= 22 || h < 6 ? "sleepy" : "idle"; // Rick gets sleepy at night
    };

    function updateFace(f, now, dt) {
      const P = f.parts, s = f.s, m = f.m, o = f.out;
      const steps = dt * 30; // the Blender clips run at 30 fps

      // ease toward the current mood
      const goal = MOODS[f.mood] || {};
      const km = 1 - Math.pow(0.82, steps * 2);
      for (const key in MOOD_REST) m[key] += ((key in goal ? goal[key] : MOOD_REST[key]) - m[key]) * km;

      // pick the clip: an event animation if one is playing, otherwise the idle ones in turn
      if (f.action && now > f.action.until) f.action = null;
      if (now > f.idle.until) {
        const name = nextIdle(f);
        f.idle = { name, start: now, until: now + clipMs(name) };
        if (name !== "idle_breathe") voice(name, 0.5); // quieter sounds while he's just hanging out
      }
      const cur = f.action || f.idle;
      const frame = reducedMotion ? 0 : ((now - cur.start) / 1000) * RIG_CLIPS.fps;
      const V = (ch) => clipValue(cur.name, ch, frame);
      const mw = f.action ? 0.35 : 1; // moods are gentler while an animation is acting

      // where to look: Mom's finger wins during idle, the clip otherwise
      let hx = V("hx"), hy = V("hy"), ex = V("ex"), ey = V("ey");
      if (!f.action && now < f.pointer.until) { ex = f.pointer.x; ey = f.pointer.y; hx = ex * 0.8; hy = ey * 0.8; }
      hy += m.lookY * mw; ey += m.lookY * mw;
      const kh = 1 - Math.pow(f.action ? 0.25 : 0.78, steps), ke = 1 - Math.pow(f.action ? 0.2 : 0.45, steps);
      s.hx += (hx - s.hx) * kh; s.hy += (hy - s.hy) * kh;
      s.ex += (ex - s.ex) * ke; s.ey += (ey - s.ey) * ke;

      // everything else: the clip plus the mood, smoothed a little so switching clips never pops
      const target = {
        blink: Math.max(V("blink"), m.blinkMin * mw), tilt: V("tilt"),
        blY: V("blY") + m.bl * mw, blR: V("blR") + m.blR * mw, brY: V("brY") + m.br * mw, brR: V("brR") + m.brR * mw,
        rootY: V("rootY"), rootSX: V("rootSX"), rootSY: V("rootSY"),
        mouthY: V("mouthY") + m.mY * mw, mouthSX: V("mouthSX") * (1 + (m.mSX - 1) * mw),
        mouthSY: V("mouthSY") * (1 + (m.mSY - 1) * mw), iris: V("iris") * (1 + (m.iris - 1) * mw), breath: V("breath"),
      };
      const ko = 1 - Math.pow(0.3, steps);
      for (const key in target) o[key] += (target[key] - o[key]) * ko;
      const mRot = f.mood === "sick" ? Math.sin(now / 180) * 0.05 : 0; // queasy mustache

      // hair: the same spring as bake_hair() in Blender, but live, so it also reacts to Mom's finger
      s.hairVX = (s.hairVX + (s.hx - s.hairX) * 0.14 * steps) * Math.pow(0.8, steps); s.hairX += s.hairVX * steps;
      s.hairVY = (s.hairVY + (o.rootY - s.hairY) * 0.2 * steps) * Math.pow(0.75, steps); s.hairY += s.hairVY * steps;
      const lagX = (s.hairX - s.hx) * 0.06, lagY = (s.hairY - o.rootY) * 0.35;

      // apply, mirroring the bone drivers in build_rick_rig.py (CSS y points down, Blender up)
      const pct = (v) => v.toFixed(3) + "%";
      const deg = (r) => (r * DEG).toFixed(3) + "deg";
      P.root.style.transform = `translateY(${pct(-o.rootY * UY)}) scale(${o.rootSX.toFixed(4)}, ${o.rootSY.toFixed(4)})`;
      P.head.style.transform = `translateX(${pct(s.hx * 0.02 * UX)}) rotate(${deg(s.hx * 0.07 - o.tilt)}) scaleY(${o.breath.toFixed(4)})`;
      P.hair.style.transform = `translate(${pct((-s.hx * 0.012 + lagX) * UX)}, ${pct((s.hy * 0.01 - lagY) * UY)})`;
      P.face.style.transform = `translate(${pct(s.hx * 0.05 * UX)}, ${pct(-s.hy * 0.035 * UY)})`;
      P.nose.style.transform = `translate(${pct(s.hx * 0.03 * UX)}, ${pct(-s.hy * 0.012 * UY)})`;
      const irisT = `translate(${pct(s.ex * 0.045 * UX)}, ${pct(-s.ey * 0.028 * UY)}) scale(${o.iris.toFixed(4)})`;
      P.irisL.style.transform = irisT;
      P.irisR.style.transform = irisT;
      P.lids.style.transform = `translateY(${pct(-(1 - Math.min(1, o.blink)) * 0.36 * UY)})`;
      P.browL.style.transform = `translateY(${pct(-o.blY * UY)}) rotate(${deg(-o.blR)})`;
      P.browR.style.transform = `translateY(${pct(-o.brY * UY)}) rotate(${deg(-o.brR)})`;
      P.mouth.style.transform = `translateY(${pct(-o.mouthY * UY)}) rotate(${deg(mRot)}) scale(${o.mouthSX.toFixed(4)}, ${o.mouthSY.toFixed(4)})`;
    }

    let lastFrame = performance.now();
    function rigLoop(now) {
      const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
      lastFrame = now;
      if (document.visibilityState === "visible") faces.forEach((f) => { if (faceVisible(f)) updateFace(f, now, dt); });
      requestAnimationFrame(rigLoop);
    }

    // Rick's eyes (and head) follow Mom's finger (or mouse)
    function followPointer(e) {
      faces.forEach((f) => {
        if (!faceVisible(f)) return;
        const r = f.el.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 160);
        look(f, (dx / d) * k, (-dy / d) * k, 2500);
      });
    }
    document.addEventListener("pointermove", followPointer, { passive: true });
    document.addEventListener("pointerdown", followPointer, { passive: true });

    const homeFace = createFace($("rick"), "full");
    const resultFace = createFace($("resultFace"), "result");
    setMood(homeFace, restingMood());
    setTimeout(() => play(homeFace, "hello"), 450); // say hi when the app opens
    requestAnimationFrame(rigLoop);

    // ===== SCREENS =====
    let current = "home";

    function swapScreen(id, animate) {
      const from = $(current), to = $(id);
      from.classList.remove("active", "intro");
      if (animate) {
        from.classList.add("leaving");
        setTimeout(() => from.classList.remove("leaving"), 500);
      }
      to.scrollTop = 0;
      to.classList.remove("scrolled", "compact");
      if (id === "home") renderHome();
      if (id === "history") { renderHistory(); setUnread(false); }
      to.classList.add("active");
      current = id;
      document.body.classList.remove("urgent-mode", "love-mode", "fart-mode");
    }

    function show(id) {
      if (id === current) return;
      // Safari 18+ / Chrome: Rick's face glides between screens
      if (document.startViewTransition && !reducedMotion) {
        document.documentElement.classList.add("vt");
        const vt = document.startViewTransition(() => swapScreen(id, false));
        vt.ready.catch(() => {}); // a skipped transition still swaps the screen; nothing to report
        vt.finished.finally(() => document.documentElement.classList.remove("vt"));
      } else {
        swapScreen(id, true);
      }
    }

    document.querySelectorAll("[data-go]").forEach((b) =>
      b.addEventListener("click", () => { haptic(); show(b.dataset.go); })
    );

    // Frosted header when scrolling
    ["choose", "history", "settings"].forEach((id) => {
      const s = $(id);
      s.addEventListener("scroll", () => {
        s.classList.toggle("scrolled", s.scrollTop > 4);
        s.classList.toggle("compact", id === "choose" && s.scrollTop > 60);
      }, { passive: true });
    });

    // ===== HOME =====
    function renderHome() {
      const h = new Date().getHours();
      const part = h < 5 ? "Hi" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
      $("greeting").textContent = part + ", " + SENDER;
      $("unreadDot").classList.toggle("show", !!load("rc-unread", false));
      if (!homeFace.tempTimer && homeFace.mood !== "surprised") setMood(homeFace, restingMood());

      const ex = lastExchange();
      const card = $("statusCard");
      if (!ex) { card.classList.remove("show"); return; }

      $("scTime").textContent = timeAgo(ex.mom.time);
      $("scMsg").textContent = (ex.mom.emoji ? ex.mom.emoji + " " : "") + ex.mom.text;
      const reply = $("scReply");
      reply.innerHTML = "";
      const waiting = isWaiting(ex);
      if (ex.reply) {
        const span = el("span");
        span.append(el("b", null, "Rick: "), decorate(ex.reply.text));
        reply.append(faceSm(), span);
      } else if (waiting) {
        const dots = el("span", "dots"); dots.innerHTML = "<i></i><i></i><i></i>";
        reply.append(faceSm(), el("span", "muted", "Waiting for Rick"), dots);
      }
      card.classList.toggle("waiting", waiting);
      if (!card.classList.contains("show")) card.classList.add("show");
    }

    $("statusCard").addEventListener("click", () => { haptic(); show("history"); });
    $("historyBtn").addEventListener("click", () => { haptic(); show("history"); });

    // Rick's face tilts toward your finger when pressed
    const rickBtn = $("rick");
    rickBtn.addEventListener("pointerdown", (e) => {
      const r = rickBtn.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      rickBtn.style.setProperty("--ry", (x * 22).toFixed(1) + "deg");
      rickBtn.style.setProperty("--rx", (-y * 22).toFixed(1) + "deg");
      rickBtn.classList.add("pressed");
      play(homeFace, "tap_surprise"); // "Oh! Mom needs me!"
      rub = { x: e.clientX, y: e.clientY, dist: 0 };
      rubbed = false;
    });
    // Secret: rub your finger around on Rick's face and he gets dizzy
    let rub = null, rubbed = false;
    rickBtn.addEventListener("pointermove", (e) => {
      if (!rub) return;
      rub.dist += Math.hypot(e.clientX - rub.x, e.clientY - rub.y);
      rub.x = e.clientX;
      rub.y = e.clientY;
      if (rub.dist > 700 && !rubbed) { rubbed = true; haptic(); play(homeFace, "dizzy"); }
    });
    const releaseRick = () => {
      rub = null;
      rickBtn.classList.remove("pressed");
      rickBtn.style.setProperty("--rx", "0deg");
      rickBtn.style.setProperty("--ry", "0deg");
    };
    ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => rickBtn.addEventListener(ev, releaseRick));
    rickBtn.addEventListener("click", () => {
      if (rubbed) { rubbed = false; return; } // that was a rub, not a tap
      haptic();
      rickBtn.classList.add("pressed");
      setTimeout(() => { releaseRick(); show("choose"); }, 300); // let his startled jump show first
    });

    // Keep "5 min ago" fresh
    setInterval(() => { if (current === "home") renderHome(); }, 30000);

    // ===== CHOOSE =====
    function makeCard(opt, i, variant) {
      const btn = el("button", "card glass" + (variant ? " " + variant : ""));
      btn.style.setProperty("--i", i);
      if (opt.color) btn.style.setProperty("--c", opt.color);
      const tile = el("span", "tile", opt.emoji);
      const label = el("div", "label", opt.label);
      const sub = el("div", "sub", opt.sub);
      if (variant) {
        const text = el("div");
        text.append(label, sub);
        btn.append(tile, text, chevron());
      } else {
        btn.append(tile, label, sub);
        if (opt.location) btn.appendChild(el("span", "pin", "📍 Location"));
      }

      // Glow follows the finger
      btn.addEventListener("pointerdown", (e) => {
        const r = btn.getBoundingClientRect();
        btn.style.setProperty("--x", e.clientX - r.left + "px");
        btn.style.setProperty("--y", e.clientY - r.top + "px");
        btn.classList.add("pressing");
      });
      ["pointerup", "pointercancel", "pointerleave"].forEach((ev) =>
        btn.addEventListener(ev, () => btn.classList.remove("pressing"))
      );
      btn.addEventListener("click", () => {
        if (sending) return;
        haptic();
        btn.classList.add("chosen");
        setTimeout(() => { btn.classList.remove("chosen"); send(opt); }, 150);
      });
      return btn;
    }

    function renderCards() {
      for (const id of ["urgentSlot", "grid", "fartSlot"]) $(id).innerHTML = "";
      $("urgentSlot").appendChild(makeCard(URGENT, 0, "urgent"));
      OPTIONS.forEach((opt, i) => $("grid").appendChild(makeCard(opt, i + 1, null)));
      $("fartSlot").appendChild(makeCard(FART, OPTIONS.length + 1, "fart"));
    }
    renderCards();

    // ===== SETTINGS SCREEN =====
    const PALETTE = ["#34c759", "#5ac8fa", "#ff9f0a", "#ffd60a", "#0a84ff", "#ff6b6b", "#bf5af2", "#ff2d55", "#64d2ff", "#30d158"];
    let cardsTimer = null;
    const cardsSoon = () => { clearTimeout(cardsTimer); cardsTimer = setTimeout(renderCards, 250); };

    function renderOptEditor() {
      const box = $("optEditor");
      box.innerHTML = "";
      OPTIONS.forEach((opt, i) => {
        const row = el("div", "opt-row glass");
        row.style.animationDelay = i * 30 + "ms";
        const emoji = el("input", "opt-emoji");
        emoji.value = opt.emoji; emoji.maxLength = 8; emoji.setAttribute("aria-label", "Emoji");
        const fields = el("div", "opt-fields");
        const label = el("input", "opt-label");
        label.value = opt.label; label.maxLength = 22; label.placeholder = "Button name";
        const msg = el("input", "opt-msg");
        msg.value = opt.message; msg.maxLength = 120; msg.placeholder = "What Rick's phone will say";
        fields.append(label, msg);
        const tools = el("div", "opt-tools");
        const up = el("button", "opt-up", "↑");
        up.disabled = i === 0; up.setAttribute("aria-label", "Move up");
        const del = el("button", "opt-del", "✕");
        del.disabled = OPTIONS.length <= 1; del.setAttribute("aria-label", "Delete");
        tools.append(up, del);
        row.append(emoji, fields, tools);

        emoji.addEventListener("input", () => { opt.emoji = emoji.value.trim() || "⭐"; saveOptions(); cardsSoon(); });
        label.addEventListener("input", () => { opt.label = label.value.trim() || "Help"; opt.sub = ""; saveOptions(); cardsSoon(); });
        msg.addEventListener("input", () => { opt.message = msg.value.trim() || opt.label; opt.sub = ""; saveOptions(); cardsSoon(); });
        up.addEventListener("click", () => {
          haptic();
          [OPTIONS[i - 1], OPTIONS[i]] = [OPTIONS[i], OPTIONS[i - 1]];
          saveOptions(); renderOptEditor(); renderCards();
        });
        del.addEventListener("click", () => {
          haptic();
          OPTIONS.splice(i, 1);
          saveOptions(); renderOptEditor(); renderCards();
        });
        box.appendChild(row);
      });
      $("addOpt").disabled = OPTIONS.length >= 12;
    }

    $("addOpt").addEventListener("click", () => {
      if (OPTIONS.length >= 12) return;
      haptic();
      OPTIONS.push({ emoji: "⭐", label: "New button", sub: "", color: PALETTE[OPTIONS.length % PALETTE.length],
        message: "Can you help me?", tag: "speech_balloon", priority: 3, replies: DEFAULT_REPLIES.slice() });
      saveOptions(); renderOptEditor(); renderCards();
      const labels = $("optEditor").querySelectorAll(".opt-label");
      labels[labels.length - 1].focus();
      labels[labels.length - 1].select();
    });

    // Reset needs two taps, so it can't happen by accident
    let resetArmed = null;
    $("resetOpts").addEventListener("click", () => {
      haptic();
      const btn = $("resetOpts");
      if (!resetArmed) {
        btn.textContent = "Tap again to reset all buttons";
        resetArmed = setTimeout(() => { resetArmed = null; btn.textContent = "Reset to the original buttons"; }, 3000);
        return;
      }
      clearTimeout(resetArmed); resetArmed = null;
      btn.textContent = "Reset to the original buttons";
      OPTIONS = DEFAULT_OPTIONS.map(cloneOpt);
      saveOptions(); renderOptEditor(); renderCards();
    });

    $("prefName").value = prefs.name;
    $("prefSound").checked = prefs.sound;
    $("prefHat").value = prefs.hat;
    $("prefName").addEventListener("input", (e) => { prefs.name = e.target.value.trim(); SENDER = prefs.name || "Mom"; savePrefs(); renderHome(); });
    $("prefSound").addEventListener("change", (e) => { prefs.sound = e.target.checked; savePrefs(); if (prefs.sound) { unlockAudio(); setTimeout(() => voice("hello"), 80); } });
    $("prefHat").addEventListener("change", (e) => { prefs.hat = e.target.value; savePrefs(); applyHats(); });
    $("settingsBtn").addEventListener("click", () => { haptic(); renderOptEditor(); show("settings"); });

    // ===== FUN EXTRAS =====
    // Rick's hats, drawn in SVG so they look crisp at any size
    const HATS = {
      santa: `<svg viewBox="0 0 120 80"><path d="M12 64 Q 28 12 76 6 Q 100 4 108 26 Q 94 18 84 22 Q 98 40 108 64 Z" fill="#e0262b"/><path d="M12 64 Q 28 12 76 6 Q 54 18 46 64 Z" fill="#b91c1c" opacity=".45"/><circle cx="107" cy="29" r="9" fill="#fff"/><rect x="4" y="54" width="112" height="20" rx="10" fill="#fff"/><rect x="4" y="66" width="112" height="8" rx="4" fill="#e5e7eb"/></svg>`,
      party: `<svg viewBox="0 0 120 80"><defs><clipPath id="pc"><path d="M60 4 L96 74 L24 74 Z"/></clipPath></defs><path d="M60 4 L96 74 L24 74 Z" fill="#ff2d55"/><g clip-path="url(#pc)" fill="#ffd60a"><path d="M10 40 L110 20 L110 30 L10 50 Z"/><path d="M10 62 L110 42 L110 52 L10 72 Z"/></g><circle cx="60" cy="5" r="7" fill="#5ac8fa"/><circle cx="40" cy="58" r="3" fill="#fff"/><circle cx="72" cy="34" r="3" fill="#fff"/></svg>`,
      witch: `<svg viewBox="0 0 120 80"><ellipse cx="60" cy="68" rx="58" ry="10" fill="#241b3a"/><path d="M30 66 Q 44 34 56 20 Q 64 8 86 2 Q 72 14 72 30 Q 76 50 90 66 Z" fill="#2e2350"/><path d="M31 56 L89 56 L91 66 L29 66 Z" fill="#9333ea"/><rect x="54" y="55" width="12" height="11" rx="2" fill="none" stroke="#facc15" stroke-width="3"/></svg>`,
      leprechaun: `<svg viewBox="0 0 120 80"><ellipse cx="60" cy="70" rx="56" ry="9" fill="#166534"/><rect x="30" y="10" width="60" height="60" rx="6" fill="#16a34a"/><rect x="30" y="50" width="60" height="11" fill="#111827"/><rect x="51" y="47" width="18" height="17" rx="2" fill="none" stroke="#facc15" stroke-width="3.5"/><text x="80" y="36" font-size="18">☘️</text></svg>`,
      hearts: `<svg viewBox="0 0 120 80"><path d="M8 78 Q 60 40 112 78" fill="none" stroke="#ff2d55" stroke-width="6" stroke-linecap="round"/><g class="bob"><path d="M38 58 L30 22" stroke="#ff2d55" stroke-width="3"/><path d="M30 26 C 18 16 20 2 30 8 C 40 2 42 16 30 26 Z" fill="#ff2d55"/></g><g class="bob two"><path d="M82 58 L90 22" stroke="#ff2d55" stroke-width="3"/><path d="M90 26 C 78 16 80 2 90 8 C 100 2 102 16 90 26 Z" fill="#ff2d55"/></g></svg>`,
    };
    const sameDay = (d, month, day) => d.getMonth() + 1 === month && d.getDate() === day;
    const isBirthday = (who, d = new Date()) => sameDay(d, who.month, who.day);
    function holidayHat(d = new Date()) {
      const month = d.getMonth() + 1, day = d.getDate();
      if (isBirthday(MOM_BIRTHDAY, d) || isBirthday(RICK_BIRTHDAY, d)) return "party";
      if (month === 10 && day >= 8) return "witch";                                // Halloween: after the first week of October
      if (month === 12 && day <= 27) return "santa";                               // Christmas: December 1-27
      if ((month === 12 && day >= 28) || (month === 1 && day === 1)) return "party"; // New Year's: Dec 28 - Jan 1
      if (month === 2 && day >= 10 && day <= 14) return "hearts";
      if (month === 3 && day === 17) return "leprechaun";
      return "none";
    }
    function applyHats() {
      const hat = prefs.hat === "auto" ? holidayHat() : prefs.hat;
      faces.forEach((f) => {
        const box = f.el.querySelector(".rf-hat");
        box.dataset.hat = hat;
        box.innerHTML = HATS[hat] || "";
      });
    }
    applyHats();

    let toastTimer = null;
    function toast(text, ms = 4500) {
      const t = $("toast");
      t.textContent = text;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), ms);
    }

    function confetti(count = 90) {
      if (reducedMotion) return;
      const fx = $("fx"), colors = ["#ff3b30", "#ff9f0a", "#ffd60a", "#34c759", "#5ac8fa", "#bf5af2", "#ff2d55", "#ffffff"];
      for (let i = 0; i < count; i++) {
        const c = el("span", "confetti");
        c.style.left = Math.random() * 100 + "%";
        c.style.background = colors[i % colors.length];
        c.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
        c.style.setProperty("--spin", (Math.random() * 1080 - 540) + "deg");
        c.style.setProperty("--dur", 2.4 + Math.random() * 1.8 + "s");
        c.style.animationDelay = Math.random() * 0.8 + "s";
        if (i % 3 === 0) c.style.borderRadius = "50%";
        fx.appendChild(c);
        setTimeout(() => c.remove(), 5200);
      }
    }

    // Birthdays and holidays: a greeting (once a day), confetti for the big ones
    function celebrate() {
      const d = new Date(), key = d.toDateString();
      if (load("rc-celebrated", "") === key) return;
      let msg = null, party = false;
      if (isBirthday(MOM_BIRTHDAY, d)) { msg = "🎂 Happy Birthday, " + SENDER + "!"; party = true; }
      else if (isBirthday(RICK_BIRTHDAY, d)) { msg = "🎂 It's Rick's birthday! Send him some love ❤️"; party = true; }
      else if (sameDay(d, 1, 1)) { msg = "🎉 Happy New Year!"; party = true; }
      else if (sameDay(d, 12, 25)) msg = "🎄 Merry Christmas!";
      else if (sameDay(d, 10, 31)) msg = "🎃 Happy Halloween!";
      else if (sameDay(d, 2, 14)) msg = "❤️ Happy Valentine's Day!";
      else if (sameDay(d, 3, 17)) msg = "☘️ Happy St. Patrick's Day!";
      if (!msg) return;
      save("rc-celebrated", key);
      setTimeout(() => { toast(msg, 6000); if (party) confetti(120); play(homeFace, "hello"); }, 1000);
    }
    celebrate();

    // Secret: tap the "Rick Caller" title 5 times fast and Rick dances
    let titleTaps = [];
    document.querySelector(".title").addEventListener("click", () => {
      const now = Date.now();
      titleTaps = titleTaps.filter((t) => now - t < 2000);
      titleTaps.push(now);
      if (titleTaps.length < 5) return;
      titleTaps = [];
      unlockAudio();
      haptic();
      const dancer = document.querySelector(".breathe");
      dancer.classList.remove("dance");
      void dancer.offsetWidth;
      dancer.classList.add("dance");
      setTimeout(() => dancer.classList.remove("dance"), 1500);
      play(homeFace, "laugh");
      confetti(70);
      toast("🕺 You found Rick's secret dance!");
    });

    // A new (true!) fun fact every day
    const FACTS = [
      "Octopuses have three hearts and blue blood.",
      "Honey never spoils. Edible honey has been found in ancient Egyptian tombs.",
      "Bananas are berries, but strawberries aren't.",
      "Sea otters hold hands while they sleep so they don't drift apart.",
      "A group of flamingos is called a flamboyance.",
      "Wombat poop is shaped like cubes.",
      "Sloths can hold their breath for up to 40 minutes.",
      "A day on Venus is longer than a whole year on Venus.",
      "Butterflies taste with their feet.",
      "Koalas have fingerprints that look almost like ours.",
      "Sharks have been around longer than trees.",
      "The Eiffel Tower gets about 6 inches taller in summer heat.",
      "A blue whale's heart can weigh about 400 pounds.",
      "Cats sleep around 12 to 16 hours a day.",
      "Hummingbirds are the only birds that can fly backwards.",
      "A bolt of lightning is about five times hotter than the surface of the sun.",
      "There are more trees on Earth than stars in our galaxy.",
      "Some turtles can breathe through their rear end.",
      "An ostrich's eye is bigger than its brain.",
      "Giraffes have seven neck bones, the same as people.",
      "Peanuts aren't nuts. They're legumes, like beans.",
      "The Moon drifts about 1.5 inches farther from Earth every year.",
      "Dolphins have their own signature whistles, kind of like names.",
      "A shrimp's heart is in its head.",
      "Elephants can't jump.",
      "A pineapple takes about two years to grow.",
      "Ketchup was sold as a medicine in the 1830s.",
      "Honeybees can learn to recognize human faces.",
      "Mount Everest grows a few millimeters taller every year.",
      "Polar bears have black skin under their white fur.",
    ];
    const dayNumber = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
    $("factChip").addEventListener("click", () => {
      haptic();
      unlockAudio();
      const chip = $("factChip");
      const open = !chip.classList.contains("open");
      chip.classList.remove("open");
      void chip.offsetWidth;
      chip.classList.toggle("open", open);
      chip.textContent = open ? "💡 " + FACTS[dayNumber() % FACTS.length] : "💡 Rick's fun fact of the day";
      if (open) play(homeFace, "talk_reply");
    });

    const input = $("customText");
    input.addEventListener("input", () => $("sendBtn").classList.toggle("ready", input.value.trim().length > 0));
    $("compose").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      input.value = "";
      input.blur();
      const sendBtn = $("sendBtn");
      sendBtn.classList.remove("fly");
      void sendBtn.offsetWidth;
      sendBtn.classList.add("fly");
      sendBtn.classList.remove("ready");
      send({ emoji: "💬", label: "Message", message: text, tag: "speech_balloon", priority: 3 });
    });

    // ===== SEND =====
    // Rick's app, where he can type a reply (only once the app is online, e.g. on GitHub Pages)
    const RICK_APP_URL = /^https?:$/.test(location.protocol) ? new URL("rick.html#reply", location.href).href : null;

    // Rick's notification buttons (ntfy allows 3): two one-tap replies + "Type a reply", which opens his app
    function buildActions(replies) {
      const quick = replies.slice(0, RICK_APP_URL ? 2 : 3)
        .map((r) => `http, ${r}, https://ntfy.sh/${REPLY_TOPIC}, body=${r}, clear=true`);
      if (RICK_APP_URL) quick.push(`view, Type a reply, ${RICK_APP_URL}`);
      return quick.join("; ");
    }

    async function postToRick(body, headers) {
      const url = "https://ntfy.sh/" + NTFY_TOPIC;
      let res = await fetch(url, { method: "POST", body, headers });
      // If reply buttons or the attachment were ever rejected, still get the message through
      if (res.status === 400 && (headers.Actions || headers.Attach || headers.Click)) {
        const plain = Object.assign({}, headers);
        delete plain.Actions;
        delete plain.Attach;
        delete plain.Click;
        res = await fetch(url, { method: "POST", body, headers: plain });
      }
      return res;
    }

    function setResultText(title, text, quote) {
      const box = $("resultText");
      box.innerHTML = "";
      box.appendChild(splitLetters(el("h2"), title));
      if (text) { const p = el("p", null, text); p.style.animationDelay = "60ms"; box.appendChild(p); }
      if (quote) { const q = el("div", "quote", quote); q.style.animationDelay = "120ms"; box.appendChild(q); }
    }

    function setChip(text) {
      const chip = $("locChip");
      chip.textContent = text || "";
      chip.classList.toggle("show", !!text);
    }

    function showWaiting() {
      const area = $("replyArea");
      area.innerHTML = "";
      const box = el("div", "reply-wait glass");
      const dots = el("span", "dots"); dots.innerHTML = "<i></i><i></i><i></i>";
      box.append(faceSm(), el("span", null, "Waiting for Rick"), dots);
      area.appendChild(box);
    }

    function showReplyInResult(text) {
      const area = $("replyArea");
      area.innerHTML = "";
      const box = el("div", "reply-bubble glass");
      box.append(faceSm(), el("span", null, decorate(text)));
      area.appendChild(box);
    }

    function faceCenter() {
      const r = $("resultFace").getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function burstSparkles(colors) {
      if (reducedMotion) return;
      const { x, y } = faceCenter();
      const fx = $("fx");
      for (let i = 0; i < 18; i++) {
        const s = el("span", "spark");
        const angle = (i / 18) * Math.PI * 2 + Math.random() * 0.3;
        const dist = 60 + Math.random() * 60;
        s.style.left = x + Math.cos(angle) * 88 + "px";
        s.style.top = y + Math.sin(angle) * 88 + "px";
        s.style.background = colors[i % colors.length];
        s.style.boxShadow = "0 0 10px " + colors[i % colors.length];
        s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
        s.style.animationDelay = 0.2 + Math.random() * 0.1 + "s";
        fx.appendChild(s);
        setTimeout(() => s.remove(), 1400);
      }
    }

    function gasBurst(x, y) {
      if (reducedMotion) return;
      const fx = $("fx");
      for (let i = 0; i < 9; i++) {
        const g = el("span", "gas");
        const size = 110 + Math.random() * 110;
        const angle = Math.random() * Math.PI * 2;
        g.style.width = g.style.height = size + "px";
        g.style.left = x + "px";
        g.style.top = y + "px";
        g.style.setProperty("--dx", Math.cos(angle) * (90 + Math.random() * 90) + "px");
        g.style.setProperty("--dy", Math.sin(angle) * (70 + Math.random() * 70) + "px");
        g.style.setProperty("--s", 1.4 + Math.random());
        g.style.animationDelay = Math.random() * 0.25 + "s";
        fx.appendChild(g);
        setTimeout(() => g.remove(), 2600);
      }
      for (let i = 0; i < 7; i++) {
        const p = el("span", "puff", "💨");
        const side = i % 2 ? 1 : -1;
        p.style.left = x + side * 50 + "px";
        p.style.top = y + (Math.random() * 60 - 30) + "px";
        p.style.fontSize = 30 + Math.random() * 24 + "px";
        p.style.setProperty("--dx", side * (120 + Math.random() * 100) + "px");
        p.style.setProperty("--dy", (Math.random() * 140 - 90) + "px");
        p.style.setProperty("--rot", side * (Math.random() * 30) + "deg");
        if (side < 0) p.style.transform = "scaleX(-1)";
        p.style.animationDelay = Math.random() * 0.3 + "s";
        fx.appendChild(p);
        setTimeout(() => p.remove(), 2300);
      }
    }

    function shake() {
      if (reducedMotion) return;
      const app = document.querySelector(".app");
      app.classList.remove("shake");
      void app.offsetWidth;
      app.classList.add("shake");
      setTimeout(() => app.classList.remove("shake"), 800);
      try { navigator.vibrate && navigator.vibrate([60, 40, 120, 40, 200]); } catch (e) {}
    }

    function burstHearts() {
      if (reducedMotion) return;
      const { x, y } = faceCenter();
      const fx = $("fx");
      for (let i = 0; i < 16; i++) {
        const h = el("span", "heart", ["❤️", "💖", "💕", "💗"][i % 4]);
        h.style.left = x + (Math.random() * 160 - 80) + "px";
        h.style.top = y + "px";
        h.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
        h.style.setProperty("--rot", (Math.random() * 60 - 30) + "deg");
        h.style.animationDelay = Math.random() * 0.6 + "s";
        h.style.fontSize = 22 + Math.random() * 20 + "px";
        fx.appendChild(h);
        setTimeout(() => h.remove(), 3400);
      }
    }

    let sending = false;
    let waitingInResult = false;

    async function send(opt) {
      if (sending) return;
      sending = true;
      unlockAudio();

      const result = $("result");
      result.classList.remove("sent", "error", "farted");
      result.classList.add("sending");
      setResultText("Sending to Rick…", "", "");
      setChip("");
      $("replyArea").innerHTML = "";
      waitingInResult = false;
      // Rick looks up, thinking, while the message flies to him
      setMood(resultFace, "idle");
      play(resultFace, "thinking");
      show("result");
      if (opt.priority >= 5) document.body.classList.add("urgent-mode");
      if (opt.hearts) document.body.classList.add("love-mode");
      if (opt.fart) document.body.classList.add("fart-mode");

      const headers = {
        "Title": titleFor(opt),
        "Priority": String(opt.priority || 3),
        "Tags": opt.tag || "wave",
        "Actions": buildActions(opt.replies || DEFAULT_REPLIES),
      };
      if (RICK_APP_URL) headers["Click"] = RICK_APP_URL; // tapping the notification opens Rick's app
      let body = opt.message;
      // Attach the fart sound (only works once the app is online, e.g. on GitHub Pages)
      if (opt.fart && /^https?:$/.test(location.protocol)) {
        headers["Attach"] = new URL("fart.wav", location.href).href;
        body += "\nTap the attachment to hear it.";
      }

      let ok = false, id = null;
      try {
        const [res] = await Promise.all([
          postToRick(body, headers),
          sleep(1000), // let the animation breathe
        ]);
        ok = res.ok;
        try { id = (await res.json()).id; } catch (e) {}
      } catch (e) {
        ok = false;
      }

      result.classList.remove("sending");
      sending = false;

      if (!ok) {
        setMood(resultFace, "worried");
        play(resultFace, "sad_error");
        result.classList.add("error");
        setResultText("Didn't send", "Check that you're connected to Wi-Fi or data, then try again.", "");
        return;
      }

      result.classList.add("sent");
      haptic();
      setMood(resultFace, opt.fart ? "sick" : opt.hearts ? "love" : opt.priority >= 5 ? "surprised" : "happy");
      play(resultFace, opt.anim || (opt.fart ? "fart_react" : opt.hearts ? "love_sway" : opt.priority >= 5 ? "urgent_shock" : "sent_happy"));
      const stillHere = current === "result"; // Mom may have gone back while it was sending
      if (opt.fart) {
        result.classList.add("farted");
        playFart();
        setResultText("Fart delivered!", "It's on its way to Rick's phone. 😂", opt.message);
        if (stillHere) {
          const { x, y } = faceCenter();
          gasBurst(x, y);
          shake();
        }
      } else {
        chime(SOUND_SENT);
        setResultText("Sent!", "Your message is on its way to Rick's phone.", opt.message);
      }
      addToTimeline({ id: id || "mom-" + Date.now(), from: "mom", text: opt.display || opt.message, emoji: opt.emoji, time: Date.now() });
      save("rc-last-sent", Date.now());
      if (!stillHere) renderHome(); // show "Waiting for Rick" on the home card right away
      else if (opt.hearts) burstHearts();
      else if (!opt.fart) burstSparkles(opt.priority >= 5 ? ["#ff3b30", "#ff9f0a", "#fff"] : ["#34c759", "#a5b4fc", "#f0abfc", "#fff"]);
      waitingInResult = true;
      setTimeout(() => { if (waitingInResult && current === "result") showWaiting(); }, 800);
      if (opt.location) shareLocation(opt);
    }

    function shareLocation(opt) {
      if (!navigator.geolocation) return;
      setChip("📍 Getting your location…");
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        const map = `https://maps.google.com/?q=${latitude.toFixed(6)},${longitude.toFixed(6)}`;
        try {
          const res = await fetch("https://ntfy.sh/" + NTFY_TOPIC, {
            method: "POST",
            body: "Tap to see where " + SENDER + " is on the map.",
            headers: {
              "Title": headerName() + "'s location",
              "Priority": String(opt.priority || 3),
              "Tags": "round_pushpin",
              "Click": map,
              "Actions": `view, Open map, ${map}`,
            },
          });
          setChip(res.ok ? "📍 Location sent to Rick" : "");
        } catch (e) { setChip(""); }
      }, () => setChip(""), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    }

    const leaveResult = () => {
      haptic();
      waitingInResult = false;
      show("home");
    };
    $("doneBtn").addEventListener("click", leaveResult);
    $("resultBack").addEventListener("click", leaveResult);

    // ===== HISTORY =====
    function renderHistory() {
      const box = $("thread");
      box.innerHTML = "";
      const t = timeline();
      if (!t.length) {
        const empty = el("div", "empty");
        empty.append(el("div", "big", "💬"), el("div", null, "No messages yet."), el("div", null, "Tap Rick to send one!"));
        box.appendChild(empty);
        return;
      }
      const GROUP = 5 * 60 * 1000;
      t.forEach((e, i) => {
        const prev = t[i - 1], next = t[i + 1];
        const newBlock = !prev || e.time - prev.time > 30 * 60 * 1000;
        if (newBlock) box.appendChild(el("div", "stamp", clockTime(e.time)));
        const samePrev = prev && !newBlock && prev.from === e.from && e.time - prev.time < GROUP;
        const sameNext = next && next.from === e.from && next.time - e.time < GROUP && next.time - e.time <= 30 * 60 * 1000;

        const row = el("div", "row " + e.from);
        if (sameNext) row.classList.add("more");
        if (samePrev) row.classList.add("after");
        if (!sameNext) row.classList.add("last");
        if (!samePrev && !newBlock) row.classList.add("gap");
        row.style.animationDelay = Math.max(0, i - t.length + 12) * 30 + "ms";

        const text = e.from === "mom" ? (e.emoji ? e.emoji + " " : "") + e.text : decorate(e.text);
        if (e.from === "rick") row.appendChild(faceSm(sameNext ? "hide" : ""));
        row.appendChild(el("div", "bubble", text));
        box.appendChild(row);
      });
      requestAnimationFrame(() => { $("history").scrollTop = $("history").scrollHeight; });
    }

    // ===== RICK'S REPLIES (live connection to the reply topic) =====
    let bannerTimer = null;
    function showBanner(text) {
      $("bannerText").textContent = decorate(text);
      const b = $("banner");
      b.classList.add("show");
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => b.classList.remove("show"), 4500);
    }
    $("banner").addEventListener("click", () => {
      $("banner").classList.remove("show");
      haptic();
      show("history");
    });

    function handleIncoming(msg) {
      if (!msg || msg.event !== "message" || !msg.message) return;
      const time = msg.time ? msg.time * 1000 : Date.now();
      const text = msg.message.trim();
      const added = addToTimeline({ id: msg.id, from: "rick", text, time });
      if (msg.id) save("rc-last-reply-id", msg.id);
      if (!added) return;

      if (text === FART_BACK) {
        // Rick farted back! 💨
        playFart();
        shake();
        gasBurst(window.innerWidth / 2, window.innerHeight / 2);
      } else {
        chime(SOUND_REPLY);
        try { navigator.vibrate && navigator.vibrate([20, 80, 20]); } catch (e) {}
      }

      // Rick "talks" (mustache moves) and makes a face that matches his reply
      const replyMood = text === "Love you too" ? "love" : "happy";
      for (const f of [homeFace, resultFace]) play(f, REPLY_ANIM[text] || "talk_reply");
      if (current === "result") setMood(resultFace, replyMood);
      else tempMood(homeFace, replyMood, 4000, restingMood);

      if (current === "result" && waitingInResult) {
        waitingInResult = false;
        showReplyInResult(text);
      } else if (current === "history") {
        renderHistory();
      } else {
        showBanner(text);
        setUnread(true);
        renderHome();
        const card = $("statusCard");
        card.classList.remove("flash");
        void card.offsetWidth;
        card.classList.add("flash");
      }
    }

    let stream = null;
    function connectReplies() {
      if (stream) stream.close();
      if (!window.EventSource) return;
      const lastId = load("rc-last-reply-id", null);
      const lastSent = load("rc-last-sent", null);
      const since = lastId || (lastSent ? Math.floor(lastSent / 1000) - 5 : Math.floor(Date.now() / 1000));
      try {
        stream = new EventSource(`https://ntfy.sh/${REPLY_TOPIC}/sse?since=${since}`);
        stream.onmessage = (e) => { try { handleIncoming(JSON.parse(e.data)); } catch (err) {} };
      } catch (e) {}
    }

    // iPhone pauses web apps in the background; reconnect when Mom comes back
    let hiddenAt = 0;
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
      connectReplies();
      if (current === "home") {
        renderHome();
        if (Date.now() - hiddenAt > 60000) play(homeFace, "hello"); // Mom came back: Rick says hi
      }
    });

    // ===== EXTRA ANIMATION SETUP =====
    function splitLetters(node, text) {
      node.textContent = "";
      [...text].forEach((ch, i) => {
        const s = el("span", "letter", ch === " " ? " " : ch);
        s.style.setProperty("--d", i);
        node.appendChild(s);
      });
      return node;
    }
    const titleEl = document.querySelector(".title");
    splitLetters(titleEl, titleEl.textContent);
    titleEl.classList.add("split");

    if (!reducedMotion) {
      const bg = document.querySelector(".bg");
      for (let i = 0; i < 16; i++) {
        const p = el("span", "p");
        const size = 1.5 + Math.random() * 2.5;
        p.style.width = p.style.height = size + "px";
        p.style.left = Math.random() * 100 + "%";
        p.style.setProperty("--drift", (Math.random() * 80 - 40) + "px");
        const dur = 14 + Math.random() * 14;
        p.style.animationDuration = dur + "s";
        p.style.animationDelay = -Math.random() * dur + "s";
        bg.insertBefore(p, bg.querySelector(".vignette"));
      }
    }

    renderHome();
    connectReplies();
  </script>
</body>
</html>
